<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hotel Booking | Manali Tourism</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav">
    <a class="logo" href="index.html"><span class="logo-mark">🏔️</span><span>MANALI<small>The Valley of Gods</small></span></a>
    <nav><a class="" href="index.html">Home</a><a class="" href="heritage.html">Heritage</a><a class="active" href="hotel.html">Hotel Booking</a><a class="" href="gallery.html">Gallery</a></nav></div></header><div class="page-banner"><h1>Hotel Booking</h1><p>Plan a comfortable stay in the mountains.</p></div>
<div class="container"><form onsubmit="alert('Thank you! Your booking request has been submitted.');return false;">
<div class="form-grid">
<div><label>Full Name *</label><input required type="text" placeholder="Enter your name"></div>
<div><label>Email Address *</label><input required type="email" placeholder="you@example.com"></div>
<div><label>Phone Number *</label><input required type="tel" placeholder="+91 98765 43210"></div>
<div><label>Number of Guests *</label><select required><option value="">Select guests</option><option>1</option><option>2</option><option>3</option><option>4+</option></select></div>
<div><label>Check-in Date *</label><input required type="date"></div>
<div><label>Check-out Date *</label><input required type="date"></div>
<div><label>Room Type *</label><select required><option value="">Select room</option><option>Single Room</option><option>Double Room</option><option>Family Room</option><option>Suite</option></select></div>
<div><label>Meal Preference</label><select><option>Breakfast Included</option><option>Room Only</option><option>Breakfast + Dinner</option></select></div>
<div class="full"><label>Special Requests</label><textarea placeholder="Airport pickup, extra bed, mountain view, etc."></textarea></div>
<div class="full"><button class="btn" type="submit">Book My Stay</button></div>
</div></form></div><footer><p>Explore Manali • Feel the Nature • Create Memories</p><p>© 2026 Manali Tourism</p></footer><p class="photo-credit">Photos: Wikimedia Commons (individual licenses apply).</p></body></html>
